[project]
name = "out-of-frame"
version = "0.1.0"
description = "An AI agent that checks a Berlin address for what a property listing leaves out."
readme = "README.md"
authors = [
    { name = "Artur Vashchenkov", email = "washenkov@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
out-of-frame = "out_of_frame:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
