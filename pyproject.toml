[project]
name = "out-of-frame"
version = "0.1.0"
description = "An AI agent that checks a Berlin address for what a property listing leaves out."
readme = "README.md"
authors = [
    { name = "Artur Vashchenkov", email = "washenkov@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.12.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-anthropic>=1.7.5",
    "langgraph>=1.2.14",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "tavily-python>=0.8.5",
]

[project.scripts]
out-of-frame = "out_of_frame.cli:main"

[project.optional-dependencies]
demo = [
    "aegra-api==0.10.8",
    "aegra-cli==0.10.8",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "markdown-it-py>=4.0.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # the evals package lives at the repository root

[tool.ruff]
line-length = 100
extend-exclude = ["spikes"]  # exploratory scripts stay outside the checks

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
