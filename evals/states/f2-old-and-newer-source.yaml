# An investigation state with two searches: an undated list still gives a manufacturing company
# at the site, a news page reports a plan to end production there, and a newer, dated directory
# entry at the site's address says that it closed. The object, OSM way 32195750 in the E2
# fixtures, is the former Philip Morris factory 74 m from Neuköllnische Allee 52, 12057 Berlin,
# the E2 address; its addresses are those of the agent's address query on 2026-10-16. The pages
# web-1 and web-2 are real, were retrieved on 2026-10-16 and are kept locally in
# evals/results/pages-10-2/ (not in git); each is rewritten in new words, with names, addresses
# and the facts the finding needs kept as found. The page web-3 is written for this task: no
# real page found gives the closure with the site's address. Its date comes from Tobacco
# Journal of 25 July 2025, kept there too, where a company spokesperson says that the last
# production day at the Berlin plant was 30 June 2025; PMI's annual report for 2025 records the
# closure. The same report of Tobacco Journal says that tax stamps are still printed at the
# Berlin site; it is left out, so that closed stands for the tobacco works. The history is
# written for this task: the pages about the campus that the site is now, NLND, are left out
# too, so that the object is the factory as the map shows it.
