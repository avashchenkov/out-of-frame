    url: https://www.pmiprivacy.com/global/en/corporate-website/affiliates
    content: >-
      Philip Morris International lists its affiliates country by country, each with its
      address and a contact for questions about personal data. The page gives no date. For
      Germany it lists Philip Morris GmbH, Am Haag 14, 82166 Gräfelfing, and Philip Morris
      Manufacturing GmbH, Neuköllnische Allee 80, 12057 Berlin.
  - id: web-2
    kind: web search
    request: Philip Morris GmbH Neuköllnische Allee 80 Berlin
    url: https://deutsche-wirtschafts-nachrichten.de/712219/es-hat-sich-ausgequalmt-philip-morris-will-produktion-in-deutschland-beenden
    content: >-
      Deutsche Wirtschafts Nachrichten reports that Philip Morris wants to end its production in
      Germany. At Philip Morris Manufacturing GmbH in Berlin, production is to stop in the first
      half of 2025, and the factory in Dresden is to follow in the middle of the coming year.
      The plant in Berlin-Neukölln has been part of PMI's production network since 1972 and now
      makes ET, which is needed to make cigarettes.
