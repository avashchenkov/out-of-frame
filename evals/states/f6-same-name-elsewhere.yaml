    request: Retentionsbodenfilteranlage Berliner Wasserbetriebe
    url: https://www.bwb.de/de/pressemitteilungen-2000-2004_318.php
    content: >-
      08.05.2007. Retentionsbodenfilter in Blankenburg fertiggestellt, with the subheading that
      a Kläranlage on the upper course of the Panke works as far as the Havel. In Blankenburg, a
      part of Pankow, the Berliner Wasserbetriebe put into operation a retention soil filter
      that cleans the rainwater dirtied on the main roads nearby. About 560,000 m² of roads at
      Karower Damm and Blankenburger Pflasterweg drain into the filter at the Fließgraben,
      which flows into the Panke. The water first passes a Regenklärbecken, where the dirt
      settles, and then seeps through a soil filter of 900 m² planted with reeds. A rainwater
      retention basin of 3,300 m³ next to it holds back heavy rain. The building cost about
      4.4 million euros.

