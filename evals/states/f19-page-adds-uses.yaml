    content: |-
      Bezirksamt Treptow-Köpenick von Berlin
      Begründung zum Bebauungsplan XV-19, October 2004
      The plan is for the land between Semmelweisstraße, Rudower Straße, Am Kiesberg and Wegedornstraße in Altglienicke.
      Der Bebauungsplanentwurf XV-19 setzt allgemeine Wohngebiete und Mischgebiete zur Sicherung bestehender gewerblicher Nutzungen fest.
      The plots along the street suit mixed use, and those on Wegedornstraße above all businesses.
      In den rückwärtigen Grundstücksbereichen sollen Werkstätten und Hallen mit bis zu zwei Geschossen ermöglicht werden.
