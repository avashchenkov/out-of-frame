# An investigation state with two searches: one result offers office space at the site to
# rent, the other is the owner's own page about the site, whose snippet gives its name, its
# address and the office space on offer but not what the site is used for, and a search by the
# object's second address finds nothing. The state is F12's with
# that result and that search added: the object, OSM way 118132465, is the industrial area at Am
# Studio 16 and Köpenicker Straße 1, 934 m from Teutonenstraße 10, 12524 Berlin, the E4 address.
# Both results are real, from the same search in the full run of 2026-10-18. The offer is F12's
# page, rewritten in new words with the offer's German lines kept word for word; the owner's
# snippet is rewritten in new words, with names, places and figures kept as found. The owner's
# page, read whole, gives the site's production space and its tenants; its snippet does not.
# The first search's other three results are left out, so that no snippet settles what the site
# is. The second search is written for this task: it finds nothing, so that one call is left,
# and only a read of the owner's page can still bring the facts that its snippet lacks.
map_object:
  id: osm-way-118132465
  name: null
  details: {category: industry, landuse: industrial}
  addresses:
    - Am Studio 16, 12489 Berlin
    - Köpenicker Straße 1, 12489 Berlin
  coordinates: {lat: 52.428236549999994, lon: 13.54711195}
  distance_from_property_m: 934
  source_id: overpass-1  # the map source of the task
source_kind: map  # the kind of the map object's source

history:
  - {role: model, tool: search, query: "Am Studio 16, 12489 Berlin"}
  - {role: tool, pages: [web-1, web-2]}
  - {role: model, tool: search, query: "Köpenicker Straße 1, 12489 Berlin"}
  - {role: tool, pages: []}

