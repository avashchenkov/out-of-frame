      object_id: osm-way-49572120
      category: industry
      coordinates: {lat: 52.53070595, lon: 13.238667750000001}
      distance_tolerance_m: 310
      identified_type: plant
      status: operating
      source_url: https://www.bsr.de/energie-versorgung-muellheizkraftwerk
      search: Müllverbrennungsanlage Ruhleben
