# E1, end-to-end: the whole agent on live sources, from a first message that completes the input.
# See docs/eval-architecture.md#end-to-end.
id: E1
suite: end-to-end
covers: >-
  A wastewater treatment plant in the radius, Klärwerk Ruhleben, next to a waste incinerator and
  main railway lines. The user travels to one place.
date: today  # a live task runs with the date of the trial

# What the agent gets: the first message alone; any question fails the trial.
input:
  messages:
    - >-
      Please check Freiheit 22, 13597 Berlin. I work at Karl-Marx-Allee 3, 10178 Berlin: I leave
      home at 8:05 and leave work at 16:50.

# Read only by the graders. The labels were written on 2026-10-16 from the responses that
# evals/label.py recorded under recorded_as; each label's comment gives what the agent sees of
# the object and why the label is true. The pages were read on 2026-10-16.
expected:
  property: {lat: 52.5292863, lon: 13.2357896}
  destinations:
    - coordinates: {lat: 52.5222886, lon: 13.4189853}  # as nominatim/karl-marx-allee-3.json
      leave_home: "08:05"
      leave_place: "16:50"
      there: found
      back: found
  recorded_as: e1-freiheit-22
  labels:
