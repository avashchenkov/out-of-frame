# F8, finding: one call writes the finding from a written search history.
# See docs/eval-architecture.md#finding.
id: F8
suite: finding
covers: >-
  The type and the status stand on different pages. Two old official documents settle what the
  object is, a plant that crushes and screens construction waste at Nonnendammallee 11-14; a
  current directory entry shows a business in use there, GRAF GmbH, but names no activity, so it
  does not settle the type. A finding rests on one page: the one that settles the type, and its status
  stays null, since only another page settles it.
date: 2026-10-08  # fixed data: the date the pages were retrieved

input:
  state: f8-type-and-status-apart.yaml  # in evals/states/

# Read only by the graders. Follows the written state, not the real site.
expected:
  outcome: identified
  identified_type: plant  # construction waste is treated there, by the documents
  status: null  # only the directory entry, another page, shows the site in use
