# E4, end-to-end: the whole agent on live sources, from a first message that completes the input.
# See docs/eval-architecture.md#end-to-end.
id: E4
suite: end-to-end
covers: >-
  An active B-Plan, planned, with no construction yet: XV-25-1 is in procedure and is meant to
  allow housing on an unused plot. The user travels to two places, one outside Berlin.
date: today  # a live task runs with the date of the trial

# What the agent gets: the first message alone; any question fails the trial.
input:
  messages:
    - >-
      Please check Teutonenstraße 10, 12524 Berlin. I work at Karl-Marx-Allee 3, 10178 Berlin:
      I leave home at 7:50 and leave work at 17:20. I also go to the library at Am Kanal 47, 14467
      Potsdam: I leave home at 9:10 and leave the library at 14:35.

# Read only by the graders. The labels were written on 2026-10-16 from the responses that
# evals/label.py recorded under recorded_as; each label's comment gives what the agent sees of
# the object and why the label is true. The pages were read on 2026-10-16.
expected:
  property: {lat: 52.4184654, lon: 13.5426182}
  destinations:
    - coordinates: {lat: 52.5222886, lon: 13.4189853}  # as nominatim/karl-marx-allee-3.json
      leave_home: "07:50"
      leave_place: "17:20"
      there: found
      back: found
    - coordinates: {lat: 52.3971923, lon: 13.0592866}  # as nominatim/am-kanal-47-potsdam.json
      leave_home: "09:10"
      leave_place: "14:35"
      there: found
      back: found
  recorded_as: e4-teutonenstrasse-10
  labels:
    # 166 m: landuse=industrial; Besenbinderstraße 26, 26-28 and 28, 12524 Berlin. The page:
    # "Schrott und Altmetall", Altmetalle Hans Wasdrack, Besenbinderstrasse 26-28, with opening
    # hours. A scrap metal yard recycles waste.
    - id: wasdrack-scrap-yard
      object_id: osm-way-1197467986
      category: industry
      coordinates: {lat: 52.42027915, lon: 13.54195645}
      distance_tolerance_m: 60
      identified_type: plant
      status: operating
      source_url: https://www.wasdrack.de
      search: Besenbinderstraße 26-28 12524 Berlin
    # 254 m: landuse=industrial; Besenbinderstraße 23 and 29, 12524 Berlin. At 23, AMR
    # Dachbaustoffe sells roofing materials and makes profiles ("Herstellung von Profilen", on
    # amr-shop.de); at 29 is the allotment garden Bachespe. The making is the use that affects
    # people nearby the most, but only the firm's own site shows it, and a search by the address
    # finds directories only; with 20 results it finds the site too (spikes/search-depth).
    - id: amr-dachbaustoffe
      object_id: osm-way-1197467979
      category: industry
      coordinates: {lat: 52.42113005, lon: 13.54227905}
      distance_tolerance_m: 60
      left_out: >-
        The page that shows its making, amr-shop.de, is not within 5 results at basic depth by
        its address, which finds only directories.
    # 818 m: W. & L. Jordan GmbH NL Berlin-Adlershof, man_made=works, Ernst-Ruska-Ufer 2 and Am
    # Studio 10. A flooring wholesaler's branch: a 285 m² showroom, and storage, lorry loading
    # and dispatch, as a Jordan job advert for this address and an Adlershof article of 2012
    # show. Storing goods is the use that affects people nearby the most, so logistics, but on
    # 2026-10-20 a search by its name and address, or by either address, found only the
    # showroom page, which shows no storage.
    - id: jordan-adlershof
      object_id: osm-way-334170247
      category: industry
      coordinates: {lat: 52.42626785, lon: 13.54449675}
      distance_tolerance_m: 80
      left_out: >-
        The page that shows its storage, a Jordan job advert, is not within 5 results at basic
        depth by its name or its addresses, which find only its showroom page.
    # 878 m: landuse=industrial; Wegedornstraße 273, 12524 Berlin. No search by the address
    # finds a page about it.
    - id: wegedornstrasse-273
      object_id: osm-way-1241619192
      category: industry
      coordinates: {lat: 52.4106215, lon: 13.5447684}
      distance_tolerance_m: 50
