        Gelbe Seiten, retrieved 2026-10-03: "Mirko Müller und Marcus Rudolph Kfz-Werkstatt",
        "Autoreparaturen", "Klärwerkstr. 3, 13597 Berlin-Spandau"
        (https://www.gelbeseiten.de/gsbiz/e3d0ea74-a77c-42f4-9f93-0fd870d0e4dc)
      - >-
        Das Örtliche, retrieved 2026-10-03: "Müller KFZ-Service", "Klärwerkstr. 3",
        "Branche: Autoreparaturen in Berlin"
        (https://www.dasoertliche.de/Themen/M%C3%BCller-KFZ-Service-Berlin-Spandau-Kl%C3%A4rwerkstr)
      - >-
        nochoffen.de, retrieved 2026-10-03: opening hours Monday to Friday 08:00-18:00,
        Saturday 08:00-14:00 (https://www.nochoffen.de/haselhorst-autoservice-mueller)
    reachable: >-
      Tavily search "Klärwerkstraße 3 13597 Berlin", 2026-10-03: all five first results name
