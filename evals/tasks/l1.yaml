# L1, live investigation: the investigation subgraph runs on one object, on the live web.
# See docs/eval-architecture.md#live-investigation.
id: L1
suite: live investigation
covers: An unnamed industrial area is identified by its address, not by a name.
date: today  # a live task runs with the date of the trial

# What the agent gets. The object is near Freiheit 22, 13597 Berlin, the E1 candidate.
input:
  object:
    id: osm-way-985575964
    class: industry
    name: null
    details: {landuse: industrial}
    addresses:
      - Klärwerkstraße 3, 13597 Berlin
      - Klärwerkstraße 7, 13597 Berlin
    point: {lat: 52.52840, lon: 13.23202}  # the centre of the way's bounds in the fixture
    distance_m: 218  # nearest edge, from Freiheit 22 (52.52929, 13.23579)
    source_id: overpass-l1
  sources:
    - id: overpass-l1
      kind: map
      url: https://overpass-api.de/api/interpreter
      request: >-
        [out:json][timeout:60];way(985575964);out geom;way(985575964);map_to_area->.a;
        nwr(area.a)["addr:housenumber"];out center;
      fixture: overpass/l1-way-985575964.json
      retrieved: 2026-10-03

# Read only by the graders.
expected:
