    id: klaerwerkstrasse-3
    name: Müller KFZ-Service, also listed as Autoservice Müller, a car repair workshop
    location: [52.52840, 13.23202]  # latitude, longitude
    distance_tolerance_m: 100
    class: industry
    type: production
    status: operating
    as_of: 2026-10-03
    evidence:
