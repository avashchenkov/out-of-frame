# I5, input loop: the input phase runs until the input is complete, on recorded Nominatim
# responses. See docs/eval-architecture.md#input-loop.
id: I5
suite: input loop
covers: >-
  Recovery from an input state that missed an earlier combined answer. "Start then" alone
  adds no facts: the earlier explicit selection and no-travel answer must repair the state.
date: 2026-10-27
input:
  state: i5-missed-answers.yaml
  messages:
    - Start then.
  sources:
    - id: nominatim-1
      kind: geocoding
      url: https://nominatim.openstreetmap.org/search
      request: Hauptstraße 1, Berlin
      fixture: nominatim/hauptstrasse-1.json
    - id: nominatim-2
      kind: geocoding
      url: https://nominatim.openstreetmap.org/search
      request: Hauptstraße 1, 13591 Berlin
      fixture: nominatim/hauptstrasse-1-staaken.json
expected:
  property: {lat: 52.5288998, lon: 13.1443516}
  destinations: []
