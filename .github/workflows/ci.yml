# Offline checks only: no model calls, no keys.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: demo/frontend/package-lock.json
      - name: Install Web UI
        run: npm ci
      - name: Lint Web UI
        run: npm run lint
      - name: Check Web UI formatting
        run: npm run format:check
      - name: Check boundary test types
        run: npm run typecheck:tests
      - name: Test Web UI boundary
        run: npm test
      - name: Build Web UI
        run: npm run build

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra demo
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Tests, graders and task format
        run: uv run --no-env-file --offline --no-sync pytest --ignore=tests/demo/integration
      - name: Demo integration checks
        run: |
          docker compose --env-file /dev/null --file demo/compose.test.yaml pull
          uv run --no-env-file --offline --no-sync python tests/demo/run_integration.py
