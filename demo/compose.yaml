# One-host deployment. Only Caddy publishes ports; it serves the Web UI over HTTPS.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: out_of_frame
      POSTGRES_DB: out_of_frame
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the demo environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U out_of_frame -d out_of_frame"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    image: out-of-frame-backend:local
    restart: unless-stopped
    build:
      context: ..
      dockerfile: demo/Dockerfile
    env_file: ${OUT_OF_FRAME_DEMO_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://out_of_frame:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the demo environment}@postgres:5432/out_of_frame
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS_ON_STARTUP: "false"
      REDIS_BROKER_ENABLED: "true"
      WORKER_COUNT: "1"
      N_JOBS_PER_WORKER: "1"
      CRON_ENABLED: "false"
      LANGSMITH_TRACING: "false"
      OTEL_TARGETS: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2026/ready', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
  web:
    image: out-of-frame-web:local
    restart: unless-stopped
    build:
      context: frontend
    # Only the Web UI settings; model and source keys stay in the backend.
    environment:
      OUT_OF_FRAME_DEMO_ORIGIN: https://${OUT_OF_FRAME_DEMO_DOMAIN:?Set OUT_OF_FRAME_DEMO_DOMAIN in the demo environment}
      OUT_OF_FRAME_DEMO_BACKEND_URL: http://backend:2026
      OUT_OF_FRAME_DEMO_PROXY_SECRET: ${OUT_OF_FRAME_DEMO_PROXY_SECRET:?Set OUT_OF_FRAME_DEMO_PROXY_SECRET in the demo environment}
      OUT_OF_FRAME_DEMO_LIVE_ENABLED: ${OUT_OF_FRAME_DEMO_LIVE_ENABLED:-false}
      OUT_OF_FRAME_DEMO_CONTACT_EMAIL: ${OUT_OF_FRAME_DEMO_CONTACT_EMAIL:-}
      OUT_OF_FRAME_DEMO_OPERATOR_NAME: ${OUT_OF_FRAME_DEMO_OPERATOR_NAME:-}
      OUT_OF_FRAME_DEMO_OPERATOR_ADDRESS: ${OUT_OF_FRAME_DEMO_OPERATOR_ADDRESS:-}
      OUT_OF_FRAME_DEMO_HOSTING_PROVIDER: ${OUT_OF_FRAME_DEMO_HOSTING_PROVIDER:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/examples').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      OUT_OF_FRAME_DEMO_DOMAIN: ${OUT_OF_FRAME_DEMO_DOMAIN:?Set OUT_OF_FRAME_DEMO_DOMAIN in the demo environment}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
