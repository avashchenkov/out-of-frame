# Disposable services for integration checks. No visitor data or runtime secrets.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: demo_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: demo_test
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_test -d demo_test"]
      interval: 1s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1::6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
