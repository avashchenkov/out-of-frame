# The classes the agent checks around an address. Each class is searched within its own
# radius, measured from the property to the nearest edge of the object. A radius says where the
# agent looks. It is not a legal limit. Sources: docs/sources.md.
#
# osm_tags: an object matches if it has all the tags of one entry. A list of values means
# any of them.
#
# types: what a finding can say an object of the class is. statuses: whether it is in use.
# A finding may also say unknown for either, when the evidence cannot settle it. The agent and
# the eval labels use the same lists. Types are coarse: one per kind of impact that matters
# to a buyer, with clear borders between them. Each class has other, for a site that is
# identified but fits no type; a site that cannot be identified is unknown.
# TODO: types for the other classes and the statuses of B-Plans, with the tasks that need them.

statuses:
  operating: In use now.
  closed: No longer in use, including disused or demolished.
  under construction: Being built.
  planned: Proposed; building has not started.

investigation:
  tool_cap: 3  # tool calls per object: Tavily searches and page reads together

classes:
  - id: industry
    name: Industrial and energy sites
    why: Pollution, noise and the risk of accidents.
    radius_m: 1500
    radius_basis: >-
      Abstandserlass NRW 2007: from 1500 m (class I) down to 100 m (class VII), by the kind
      and size of the plant. The kind is not known before the investigation, so the largest
      distance is used.
    source: overpass
    osm_tags:
      - {landuse: industrial}
      - {power: plant}
      - {man_made: works}
    types:
      plant: Power, heat, waste, chemicals or fuel, made, burnt, treated or stored.
      production: Makes or repairs things, such as a factory or a workshop.
      logistics: Stores or moves goods, such as a warehouse or a depot.
      commercial: Offices, services or several businesses on one site.
      other: The evidence settles what the site is, and no type above fits.

  - id: wastewater
    name: Wastewater treatment plants
    why: Smell.
    radius_m: 500
    radius_basis: >-
      Abstandserlass NRW 2007: 300 m for plants up to 100,000 population equivalents (class V,
      no. 143), 500 m above (class IV, no. 78). The capacity is not known before the
      investigation, so the larger distance is used.
    source: overpass
    osm_tags:
      - {man_made: wastewater_plant}

  - id: airport
    name: Airports
    why: Aircraft noise.
    radius_m: 5000
    radius_basis: >-
      Chosen for this project. The Abstandserlass has no entry for airports. Aircraft noise
      follows the flight paths and can reach further.
    source: overpass
    osm_tags:
      - {aeroway: aerodrome}

  - id: road_rail
    name: Major roads and railways, including planned ones
    why: Noise.
    radius_m: 300
    radius_basis: >-
      Chosen for this project. The Abstandserlass has no entry for roads or railway lines.
    source: overpass
    osm_tags:
      - {highway: [motorway, trunk]}
      - {highway: construction, construction: [motorway, trunk]}
      - {highway: proposed, proposed: [motorway, trunk]}
      - {railway: [rail, light_rail]}
      - {railway: construction, construction: [rail, light_rail]}
      - {railway: proposed, proposed: [rail, light_rail]}

  - id: planned_development
    name: Planned development
    why: What will be built nearby.
    radius_m: 500
    radius_basis: Chosen for this project.
    source: bplan_wfs
    wfs_feature_types:
      - bplan:a_bp_iv
      - bplan:b_bp_fs
